name: Bill Meshy credential preflight (one time)

# A one-time, zero-cost verification of the owner's repository secret.
# Only a merge that creates/changes this workflow on main triggers it.
# No PR, schedule, ordinary push or paid animation task receives this secret.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bill-meshy-credential-preflight.yml

permissions:
  contents: read

jobs:
  verify:
    name: Check Meshy authentication, credit sufficiency and rig readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Perform free credential and rig readiness checks
        shell: bash
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          MESHY_RIG_TASK_ID: ${{ secrets.MESHY_RIG_TASK_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          script = Path('tools/meshy/fetch_bill_animations.py')
          spec = importlib.util.spec_from_file_location('bill_meshy_importer', script)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          key = os.getenv('MESHY_API_KEY', '')
          if not key:
              raise SystemExit('MESHY_API_KEY unavailable to this workflow. Verify the repository secret name.')
          client = module.MeshyClient(key)
          credits = client.balance()  # GET /balance: no spending and no task creation
          plan = module.load_plan(script.with_name('bill_action_plan.json'))
          required = len(plan['actions']) * module.API_ACTION_CREDITS
          print('Meshy key authenticated successfully (read-only).')
          print('All planned animations:', len(plan['actions']))
          print('Animation credits required:', required)
          print('Sufficient existing credits for full animation plan:', 'YES' if credits >= required else 'NO')
          print('Sufficient credits including a fresh API rig:', 'YES' if credits >= required + module.API_RIG_CREDITS else 'NO')
          # Do not print private account balance, token or rig task identifier in public logs.
          rig_id = os.getenv('MESHY_RIG_TASK_ID', '')
          if not rig_id:
              print('API rigging task secret configured: NO')
          else:
              try:
                  task = client.get_task('rigging', rig_id)  # GET, no spending
              except module.PipelineError:
                  raise SystemExit('API rigging task is not usable; inspect its ID privately') from None
              print('API rigging task configured: YES')
              print('API rigging task completed:', 'YES' if task.get('status') == 'SUCCEEDED' else 'NO')
          PY
