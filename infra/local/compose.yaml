# Local-only optional persistence backing services. Never use this for production.
services:
  db:
    image: postgres:17.6-alpine
    profiles: ["db"]
    environment:
      POSTGRES_USER: askbill
      POSTGRES_DB: askbill
      POSTGRES_PASSWORD: ${ASK_BILL_DEV_DB_PASSWORD:?Set local database password outside version control}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - askbill_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askbill -d askbill"]
      interval: 10s
      retries: 5
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["storage"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${ASK_BILL_DEV_STORAGE_USER:?Set local storage user}
      MINIO_ROOT_PASSWORD: ${ASK_BILL_DEV_STORAGE_PASSWORD:?Set local storage password outside version control}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - askbill_dev_storage:/data
volumes:
  askbill_dev_pg:
  askbill_dev_storage:
